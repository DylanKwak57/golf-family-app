<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏌️ Golf Family - Pro Kim</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body class="family-page">
    <div class="background-animation">
        <div class="golf-ball ball-1"></div>
        <div class="golf-ball ball-2"></div>
    </div>
    
    <div class="container">
        <!-- Header -->
        <header class="header glass-card">
            <a href="index.html" class="back-btn">←</a>
            <div class="header-title">
                <span class="header-icon">🏌️</span>
                <span>Golf Family</span>
            </div>
            <div class="user-badge">
                <span>🇰🇷 Pro Kim</span>
            </div>
        </header>
        
        <!-- Lesson Info Card -->
        <div class="card glass-card lesson-info">
            <div class="lesson-header">
                <span class="lesson-number" id="lessonNumber">107회차</span>
                <span class="lesson-status status-normal" id="lessonStatus">✅ 정상</span>
            </div>
            <div class="lesson-details">
                <div class="detail-item">
                    <span class="detail-icon">📅</span>
                    <span class="detail-text" id="lessonDate">목요일 (2026-01-16)</span>
                </div>
                <div class="detail-item">
                    <span class="detail-icon">⏰</span>
                    <span class="detail-text">17:00 - 19:00</span>
                </div>
                <div class="detail-item">
                    <span class="detail-icon">📍</span>
                    <span class="detail-text" id="lessonLocation">포탈라이</span>
                </div>
            </div>
        </div>
        
        <!-- Confirmation Section (Pro Kim Only) -->
        <div class="card glass-card confirm-section">
            <h2 class="section-title">
                <span class="section-icon">✅</span>
                <span>레슨 확인</span>
            </h2>
            <p class="section-desc">내일 레슨 가능하시면 확인해주세요</p>
            
            <div class="confirm-list">
                <div class="confirm-item single-confirm">
                    <div class="confirm-info">
                        <span class="confirm-icon">🏌️</span>
                        <span class="confirm-name">Pro Kim 확인</span>
                    </div>
                    <label class="checkbox-container">
                        <input type="checkbox" id="confirmKimPro" onchange="updateKimProConfirm()">
                        <span class="checkmark"></span>
                    </label>
                </div>
            </div>
            
            <button class="submit-btn confirm-submit" id="confirmBtn" onclick="submitKimProConfirm()" disabled>
                ✅ 확인 완료
            </button>
        </div>
        
        <!-- Toast Notification -->
        <div class="toast" id="toast">
            <span class="toast-icon">✅</span>
            <span class="toast-message" id="toastMessage">저장되었습니다</span>
        </div>
        
        <footer class="footer">
            <p>© 2026 K Family 🏌️</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
    <script>
        // Pro Kim 페이지 - 한국어 고정
        currentLang = 'ko';
        
        // loadLessonData()는 script.js DOMContentLoaded에서 호출됨 (중복 제거)
        
        // 체크박스 상태 업데이트
        function updateKimProConfirm() {
            const checkbox = document.getElementById('confirmKimPro');
            const btn = document.getElementById('confirmBtn');
            if (checkbox && btn) {
                btn.disabled = !checkbox.checked;
            }
        }
        
        // Pro Kim 확인 제출
        async function submitKimProConfirm() {
            const checkbox = document.getElementById('confirmKimPro');
            const btn = document.getElementById('confirmBtn');

            if (!checkbox.checked) {
                showToast('체크박스를 먼저 체크해주세요', 'error');
                return;
            }

            if (!currentLessonData || !currentLessonData.pageId) {
                showToast('레슨 데이터를 불러올 수 없습니다', 'error');
                return;
            }

            // 즉시 비활성화 (중복 클릭 방지)
            checkbox.disabled = true;
            btn.disabled = true;
            btn.textContent = '⏳ 처리중...';

            try {
                await sendToWebhook(CONFIG.webhooks.confirm, {
                    pageId: currentLessonData.pageId,
                    field: 'kimPro',
                    value: true,
                    timestamp: new Date().toISOString()
                });

                showToast('확인되었습니다! 감사합니다 🙏', 'success');
                btn.textContent = '✅ 확인 완료됨';

            } catch (error) {
                console.error('Confirm error:', error);
                showToast('오류가 발생했습니다. 다시 시도해주세요.', 'error');
                // 에러 시 다시 활성화
                checkbox.disabled = false;
                btn.disabled = false;
                btn.textContent = '✅ 확인 완료';
            }
        }
    </script>
</body>
</html>
